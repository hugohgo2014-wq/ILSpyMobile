name: Compilar ILSpy Mobile APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v5

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Exibir versões instaladas
        shell: pwsh
        run: |
          dotnet --info
          dotnet workload list

      - name: Instalar workload Android
        shell: pwsh
        run: dotnet workload install android

      - name: Restaurar pacotes
        shell: pwsh
        run: dotnet restore

      - name: Compilar e publicar APK
        shell: pwsh
        run: |
          dotnet publish -c Release -f net8.0-android `
            /p:AndroidPackageFormat=apk `
            /p:AndroidKeyStore=false `
            /p:AndroidGenerateNoSignatureApk=true

      - name: Procurar APK gerado
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.apk -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ilspy-mobile-apk
          path: "**/bin/Release/net8.0-android/**/*.apk"
          if-no-files-found: error
